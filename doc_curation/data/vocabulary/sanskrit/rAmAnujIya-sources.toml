# Sources of the rAmAnujIya vocabulary tries built by
# doc_curation/sanskrit/hyphenator.py (``rebuild_ra_trie()``):
#
#   rAmAnujIya.trie         - words + stems harvested from these sources;
#   rAmAnujIya-splits.trie  - the corpus's own prastuti segmentations
#                             (joined surface -> hyphenated form);
#   rAmAnujIya-ngram.trie   - junction letter-context counts from the same
#                             segmentations (longest attested context
#                             decides; >=2:1 hyphens wins a junction);
#   rAmAnujIya-seps.trie    - separator-class votes per junction ('-' within
#                             samAsa vs '–' upapada boundary);
#   rAmAnujIya-badsplits.trie - negative split evidence mined by running the
#                             analyzer over these sources (see README.md).
#   rAmAnujIya-attestations.trie - corpus attestations: bit 1 = the corpus
#                             itself uses the token (hyphen piece or whole
#                             plain token), bit 2 = e/o-final piece joined
#                             onward (replaces the former surfaces trie).
#
# A source path is a .md file or a directory (walked recursively for *.md).
# Files named ``_index.md`` are never ingested.  Sources are listed
# alphabetically.
#
# Ingestion rules (per file):
#
# * ``included_details`` lists the accepted
#   ``<details><summary>LABEL</summary>`` label prefixes of the source
#   (prefix matching: ``विश्वास-प्रस्तुतिः`` also matches its
#   ``- सावधानम्!`` style variants).  Only matching bodies are ingested;
#   मूलम् (merged plain text), translations (English, हिं, द्राविडम् ...) and
#   unpublished notes are thus skipped.  ``नीलमेघः (सं)`` deliberately
#   excludes the bare Hindi ``नीलमेघः`` commentary.
# * A file with NO accepted detail block - and every file of a source
#   without an ``included_details`` field - contributes all its Devanagari
#   text instead (absence indicates all Sanskrit text should be ingested).
#   Non-Devanagari tokens (citations, transliteration, Tamil, Hindi),
#   ``+++(...)+++`` annotation spans and HTML tags are dropped either way.
# * Prastuti text is pada-split with ``-`` at samAsa joints: hyphen pieces
#   are recorded as words, and every multi-piece token is memorised as a
#   segmentation vote (most frequent form wins; surfaces the corpus leaves
#   unhyphenated at least 3 times are marked never-split).

