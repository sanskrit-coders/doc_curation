[avagraha]
cases = [
  { input = "रामोऽस्ति", expected = "रामो ऽस्ति", note = "explicit avagraha" },
  { input = "रामोर्थः", expected = "रामो ऽर्थः", note = "lost avagraha: rAmaH + arthaH" },
  { input = "रामोर्धम्", expected = "रामो ऽर्धम्", note = "a+r+dha: voiced consonant after r" },
  { input = "चेतोर्पण", expected = "चेतो ऽर्पण", note = "lost avagraha before arpaNa" },
  { input = "प्राणप्रज्ञात्मनोर्भेदः", expected = "प्राणप्रज्ञात्मनोर्भेदः", note = "genuine visarga-r, no avagraha" },
]

