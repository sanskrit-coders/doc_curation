# Bilingual Sanskrit <-> English anchor & structural rules for translation interleaving.

# Bare rhetorical / colophon patterns that translators legitimately omit ("skip")
skip_regexes = [
  "^\\s*(?:किं\\s+युक्तम्|कुतः|कथम्|कस्मात्|किमर्थम्|कोऽर्थः|को\\s+ऽर्थः)\\s*[?।॥]*\\s*$",
  "^\\s*इति\\s+[^।॥\\n]{2,80}(?:अधिकरणम्|पादः|अध्यायः|प्रपाठकः|अनुवाकः|सूक्तम्|समाप्तम्)\\s*[।॥0-9०-९\\-\\s]*$",
]

# Opening discourse / dialectical pivots: [sanskrit_substring, [english_opening_prefixes]]
opening_pivots = [
  ["अथवा", ["or else", "or we", "alternatively"]],
  ["यद्वा", ["or else", "or "]],
  ["सन्देहः", ["--here a doubt", "here a doubt", "a doubt"]],
  ["संशयः", ["a doubt", "--here a doubt", "here a doubt", "doubt"]],
  ["उत ", ["or the", "or whether", "or is", "or does"]],
  ["ननु", ["--but", "but,", "but it", "if it be said", "an objection"]],
  ["चेन्न", ["not so", "we reply", "--not so"]],
  ["अपि च", ["moreover", "further", "besides", "again"]],
  ["किं च", ["moreover", "further", "and further", "besides"]],
  ["इतश्च", ["for the following reason also", "moreover", "further"]],
  ["तस्मात्", ["therefore", "hence", "for this reason", "so that", "consequently"]],
  ["अत एव", ["for this very reason", "hence", "therefore"]],
  ["अतः", ["hence", "therefore", "consequently"]],
  ["यतः", ["so that", "because", "for ", "since"]],
  ["एवं च सति", ["this being so", "thus"]],
  ["तदेवं", ["thus", "therefore"]],
  ["यथोक्तं", ["as is said", "as has been said", "as declared"]],
  ["तथा हि", ["for ", "thus", "to explain"]],
  ["तथा च", ["and thus", "accordingly", "so also", "similarly"]],
  ["इदमाम्नायते", ["we read", "it is declared", "scripture"]],
  ["अत्र ", ["we here", "here ", "in this"]],
  ["इदानीम्", ["now ", "next "]],
]

